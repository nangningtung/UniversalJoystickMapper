[package]
name = "ghostpad"
version = "0.1.0"
description = "Universal controller mapper for Windows"
authors = ["nangningtung"]
edition = "2021"
rust-version = "1.77"
default-run = "ghostpad"

[lib]
name = "ghostpad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gilrs = "0.11"
parking_lot = "0.12"
libloading = "0.8"
windows = { version = "0.62", features = ["Gaming_Input"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
